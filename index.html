<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIGMANJ PLAYER - MUSIC HUB</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7C5CFF">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui}
body{background:#0A0A0F;color:#fff;min-height:100vh;padding-bottom:90px}
.header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px}
.logo{font-weight:900;font-size:22px;letter-spacing:1px;background:linear-gradient(90deg,#A88BFF,#7C5CFF);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr-icons{display:flex;gap:14px}
.hdr-icons div{width:38px;height:38px;background:#1E1E2A;border-radius:50%;display:flex;align-items:center;justify-content:center}
.search-wrap{padding:0 20px;margin:10px 0}
.search-bar{width:100%;background:#1A1A27;border:1px solid #2E2E4A;border-radius:16px;padding:14px 18px;display:flex;align-items:center;gap:12px;color:#888}
.search-bar input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:16px}
.card{margin:18px 20px;background:#15151F;border-radius:20px;padding:16px;border:1px solid #2A2A3D}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.card-head h3{font-size:16px;color:#C9B6FF}
.song-row{display:flex;align-items:center;gap:12px;padding:12px;background:#1E1E2E;border-radius:14px;margin-bottom:10px;cursor:pointer}
.song-row img{width:52px;height:52px;border-radius:10px;object-fit:cover;background:#222}
.song-info{flex:1;min-width:0}
.song-info b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-info span{font-size:12px;color:#8A8A9E}
.play-btn{width:36px;height:36px;background:#7C5CFF;border-radius:50%;display:flex;align-items:center;justify-content:center}
.whatmusic{background:linear-gradient(135deg,#2A1A5A,#7C5CFF);border:none}
.whatmusic button{margin-top:12px;width:100%;background:#fff;color:#6A3FFF;font-weight:800;border:none;padding:12px;border-radius:12px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#11111A;border-top:1px solid #2A2A3D;display:flex;justify-content:space-around;padding:12px 0}
.nav-item{color:#6B6B7E;font-size:12px;text-align:center;text-decoration:none}
.nav-item.active{color:#7C5CFF}
.nav-item i{font-size:22px;display:block;margin-bottom:2px}
</style>
</head>
<body>

<div class="header">
  <div class="logo">▶ BIGMANJ PLAYET</div>
  <div class="hdr-icons"><div>🔔</div><div>👤</div></div>
</div>

<div class="search-wrap" onclick="location.href='search.html'">
  <div class="search-bar">🔍 <input placeholder="Search montagem rabeta..." readonly> 🎤</div>
</div>

<div class="card">
  <div class="card-head"><h3>🔥 Trending Now</h3><span id="trendStatus" style="color:#7C5CFF;font-size:13px">Live</span></div>
  <div id="trending"><p style="text-align:center;color:#666;padding:20px">Loading real trending...</p></div>
</div>

<div class="card whatmusic">
  <div class="card-head"><h3 style="color:#fff">🎧 WhatMusic - Ask Music</h3></div>
  <p style="font-size:13px;opacity:.8">Upload any song to identify title, artist & lyrics</p>
  <button onclick="location.href='whatmusic.html'">+ Upload & Ask Music</button>
</div>

<div class="card">
  <div class="card-head"><h3>🕓 Recently Played</h3><span onclick="clearHistory()" style="color:#666;font-size:12px;cursor:pointer">Clear</span></div>
  <div id="recent"></div>
</div>

<div class="bottom-nav">
  <a class="nav-item active" href="index.html"><i>🏠</i>Home</a>
  <a class="nav-item" href="search.html"><i>🔍</i>Search</a>
  <a class="nav-item" href="library.html"><i>📚</i>Library</a>
  <a class="nav-item" href="profile.html"><i>👤</i>Profile</a>
</div>

<script>
const API_YTS = "https://api.azbry.com/api/search/yts?query=";

// REAL TRENDING FROM API
async function loadTrending(){
 try{
  const res = await fetch(API_YTS + encodeURIComponent("funk brazil phonk 2024"));
  const data = await res.json();
  const list = (data.results || data.result || []).slice(0,8);
  render('trending', list);
 }catch(e){
  document.getElementById('trending').innerHTML = `<p style="text-align:center;color:#666;padding:20px">No internet - check connection</p>`;
 }
}

function render(id, list){
 if(!list || list.length===0){
  document.getElementById(id).innerHTML = `<p style="text-align:center;color:#666;padding:10px">No songs yet</p>`;
  return;
 }
 document.getElementById(id).innerHTML = list.map(s=>{
   const thumb = s.thumbnail || s.thumb || `https://i.ytimg.com/vi/${s.videoId}/hqdefault.jpg`;
   const title = (s.title||"").replace(/'/g,"&#39;");
   return `
   <div class="song-row" onclick="playSong('${title}','${thumb}','${s.videoId}','${(s.channel||'').replace(/'/g,'')}')">
     <img src="${thumb}" onerror="this.src='https://via.placeholder.com/52'">
     <div class="song-info"><b>${s.title}</b><span>${s.channel||s.artist||''} • ${s.views||''}</span></div>
     <div class="play-btn">▶</div>
   </div>`;
 }).join('');
}

// REAL RECENTLY PLAYED - per user from localStorage
function loadRecent(){
 const history = JSON.parse(localStorage.getItem('recent_history')||'[]');
 if(history.length===0){
  document.getElementById('recent').innerHTML = `<p style="text-align:center;color:#666;padding:20px">No history yet - Play a song and it will show here for YOU only</p>`;
  return;
 }
 document.getElementById('recent').innerHTML = history.slice(0,5).map(s=>`
  <div class="song-row" onclick="playSong('${(s.title||'').replace(/'/g,'&#39;')}','${s.thumb}','${s.videoId}','${s.artist||''}')">
    <img src="${s.thumb}"><div class="song-info"><b>${s.title}</b><span>${s.artist||''}</span></div><div class="play-btn">▶</div>
  </div>`).join('');
}

function playSong(title, thumb, videoId, artist){
 // save current
 localStorage.setItem('current_title', title);
 localStorage.setItem('current_thumb', thumb);
 localStorage.setItem('current_id', videoId||'');
 // save to REAL per-user history
 let hist = JSON.parse(localStorage.getItem('recent_history')||'[]');
 hist = hist.filter(x=>x.videoId!==videoId); // remove dup
 hist.unshift({title, thumb, videoId, artist, time: Date.now()});
 hist = hist.slice(0,20); // keep 20
 localStorage.setItem('recent_history', JSON.stringify(hist));
 location.href='player.html';
}

function clearHistory(){
 localStorage.removeItem('recent_history');
 loadRecent();
}

loadTrending();
loadRecent();
</script>
</body>
</html>
